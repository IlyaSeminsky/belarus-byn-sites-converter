<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Конвертер цен BYN</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="header__brand">
          <span class="header__mark" aria-hidden="true">$</span>
          <h1 class="header__title">Конвертер цен BYN</h1>
        </div>
        <label class="switch" title="Включить конвертацию цен">
          <input type="checkbox" id="enabled-toggle" />
          <span class="switch__track" aria-hidden="true"></span>
        </label>
      </header>

      <section class="status" id="status" aria-live="polite"></section>

      <section class="block">
        <div class="block__head">
          <h2 class="block__label">Курсы</h2>
          <span class="block__hint">переопределить</span>
        </div>
        <div class="rates">
          <div class="rate">
            <span class="rate__code">USD</span>
            <span class="rate__value" id="nbrb-USD">—</span>
            <input
              class="rate__input"
              type="number"
              step="0.0001"
              min="0"
              id="manual-USD"
              placeholder="вручную"
              aria-label="Ручной курс USD"
            />
            <button
              type="button"
              class="rate__clear"
              id="clear-USD"
              title="Сбросить ручной курс"
              aria-label="Сбросить ручной курс USD"
            >
              ×
            </button>
          </div>
          <div class="rate">
            <span class="rate__code">EUR</span>
            <span class="rate__value" id="nbrb-EUR">—</span>
            <input
              class="rate__input"
              type="number"
              step="0.0001"
              min="0"
              id="manual-EUR"
              placeholder="вручную"
              aria-label="Ручной курс EUR"
            />
            <button
              type="button"
              class="rate__clear"
              id="clear-EUR"
              title="Сбросить ручной курс"
              aria-label="Сбросить ручной курс EUR"
            >
              ×
            </button>
          </div>
        </div>
        <p class="error" id="manual-error" hidden></p>
      </section>

      <section class="block">
        <h2 class="block__label">Показывать на странице</h2>
        <div class="segmented" role="radiogroup" aria-label="Режим отображения">
          <button type="button" class="segmented__option" role="radio" data-mode="USD">USD</button>
          <button type="button" class="segmented__option" role="radio" data-mode="EUR">EUR</button>
          <button type="button" class="segmented__option" role="radio" data-mode="USD_EUR">
            Оба
          </button>
        </div>
      </section>

      <section class="block">
        <h2 class="block__label">Сайты</h2>
        <div class="sites" id="sites-list"></div>
      </section>

      <footer class="footer">
        <button type="button" class="refresh" id="refresh-button">Обновить курсы</button>
        <p class="footer__note">Официальные курсы Национального банка Республики Беларусь</p>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
